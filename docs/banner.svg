<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e293b"/>
      <stop offset=".6" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(250 60) scale(520 300)">
      <stop offset="0" stop-color="#2dd4bf" stop-opacity=".35"/>
      <stop offset="1" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1120 300) scale(560 300)">
      <stop offset="0" stop-color="#818cf8" stop-opacity=".35"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="icon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset=".55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".45"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset=".5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a5b4fc"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect width="1280" height="320" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1280" height="320" fill="url(#bg)"/>
    <rect width="1280" height="320" fill="url(#glowA)"/>
    <rect width="1280" height="320" fill="url(#glowB)"/>
    <rect width="1280" height="320" fill="url(#grid)"/>

    <!-- pixel art scattered on the right -->
    <g opacity=".9">
      <rect x="896" y="64" width="32" height="32" fill="#c084fc"/>
      <rect x="928" y="64" width="32" height="32" fill="#c084fc"/>
      <rect x="960" y="64" width="32" height="32" fill="#f472b6"/>
      <rect x="992" y="64" width="32" height="32" fill="#f472b6"/>
      <rect x="1024" y="64" width="32" height="32" fill="#fb923c" opacity=".55"/>
      <rect x="896" y="96" width="32" height="32" fill="#f472b6"/>
      <rect x="928" y="96" width="32" height="32" fill="#fb923c"/>
      <rect x="960" y="96" width="32" height="32" fill="#fde047"/>
      <rect x="992" y="96" width="32" height="32" fill="#fb923c"/>
      <rect x="1024" y="96" width="32" height="32" fill="#fde047" opacity=".55"/>
      <rect x="896" y="128" width="32" height="32" fill="#60a5fa"/>
      <rect x="928" y="128" width="32" height="32" fill="#fde047"/>
      <rect x="960" y="128" width="32" height="32" fill="#fef9c3"/>
      <rect x="992" y="128" width="32" height="32" fill="#fde047"/>
      <rect x="1024" y="128" width="32" height="32" fill="#60a5fa" opacity=".55"/>
      <rect x="896" y="160" width="32" height="32" fill="#34d399"/>
      <rect x="928" y="160" width="32" height="32" fill="#34d399"/>
      <rect x="960" y="160" width="32" height="32" fill="#60a5fa"/>
      <rect x="992" y="160" width="32" height="32" fill="#34d399" opacity=".55"/>
      <rect x="896" y="192" width="32" height="32" fill="#22c55e"/>
      <rect x="928" y="192" width="32" height="32" fill="#22c55e" opacity=".55"/>
      <!-- template ghost squares still to paint -->
      <rect x="1056" y="64" width="32" height="32" fill="none" stroke="#fff" stroke-opacity=".25" stroke-dasharray="4 4"/>
      <rect x="1056" y="96" width="32" height="32" fill="none" stroke="#fff" stroke-opacity=".25" stroke-dasharray="4 4"/>
      <rect x="1056" y="128" width="32" height="32" fill="none" stroke="#fff" stroke-opacity=".25" stroke-dasharray="4 4"/>
      <rect x="1024" y="160" width="32" height="32" fill="none" stroke="#fff" stroke-opacity=".25" stroke-dasharray="4 4"/>
      <rect x="1056" y="160" width="32" height="32" fill="none" stroke="#fff" stroke-opacity=".25" stroke-dasharray="4 4"/>
      <rect x="960" y="192" width="32" height="32" fill="none" stroke="#fff" stroke-opacity=".25" stroke-dasharray="4 4"/>
      <rect x="992" y="192" width="32" height="32" fill="none" stroke="#fff" stroke-opacity=".25" stroke-dasharray="4 4"/>
      <rect x="1024" y="192" width="32" height="32" fill="none" stroke="#fff" stroke-opacity=".25" stroke-dasharray="4 4"/>
      <rect x="1056" y="192" width="32" height="32" fill="none" stroke="#fff" stroke-opacity=".25" stroke-dasharray="4 4"/>
    </g>
    <!-- ghost cursor -->
    <g transform="translate(1000 168) scale(.9)">
      <circle cx="0" cy="0" r="16" fill="#5eead4" fill-opacity=".25" stroke="#5eead4" stroke-width="2"/>
      <path d="M0 0 L0 50 L13 37 L22 56 L33 51 L24 32 L43 32 Z" fill="#fff" stroke="#0f172a" stroke-width="5" stroke-linejoin="round"/>
    </g>

    <!-- logo -->
    <g transform="translate(88 96)">
      <rect x="0" y="0" width="128" height="128" rx="32" fill="url(#icon)"/>
      <rect x="0" y="0" width="128" height="128" rx="32" fill="url(#shine)"/>
      <rect x="1" y="1" width="126" height="126" rx="31" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="2"/>
      <rect x="20" y="20" width="32" height="32" rx="6" fill="#0f172a"/>
      <rect x="56" y="20" width="32" height="32" rx="6" fill="#0f172a" fill-opacity=".45"/>
      <rect x="20" y="56" width="32" height="32" rx="6" fill="#0f172a" fill-opacity=".45"/>
      <path d="M58 56 L58 108 L71 95 L80 114 L91 109 L82 90 L101 90 Z" fill="#fff" stroke="#0f172a" stroke-width="6" stroke-linejoin="round"/>
    </g>

    <text x="252" y="170" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="84" font-weight="800" fill="url(#title)" letter-spacing="-1">WPaint</text>
    <rect x="572" y="118" width="74" height="34" rx="17" fill="#fff" fill-opacity=".08" stroke="#fff" stroke-opacity=".2"/>
    <text x="609" y="141" text-anchor="middle" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#e2e8f0">v1.0</text>
    <text x="256" y="216" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#cbd5e1">Template overlay and assisted painting for WPlace</text>
    <text x="256" y="254" font-family="Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif" font-size="19" fill="#94a3b8">Auto Place  ·  Auto-Paint  ·  Live resizing  ·  Owned colors</text>

    <rect x=".5" y=".5" width="1279" height="319" rx="28" fill="none" stroke="#fff" stroke-opacity=".12"/>
  </g>
</svg>
